<div class="hero-banner" style="background-image: linear-gradient(135deg, rgba(12, 13, 17, 0.8), rgba(12, 13, 17, 0.4)), url('/static/uploads/home_banner_premium.png');">
    <div class="hero-glass">
        <div class="hero-header">
            <h1 class="hero-title">
                <span class="decorative-text">Strona</span> Serwera
            </h1>
            <p class="hero-subtitle">
                Skonfiguruj publiczną wizytówkę swojego serwera. Ustaw opis, tagi i udostępnij link zaproszenia całemu światu.
            </p>
        </div>
    </div>
</div>

<div class="settings-card">
    <div class="card-header">
        <h3><i class="fas fa-globe"></i> Ustawienia Publiczne</h3>
    </div>
    <div class="card-body">
        <div class="modal-section">
            <label class="modal-label">PUBLICZNY OPIS:</label>
            <textarea class="modal-input" style="height: 120px; resize: none;" placeholder="Opisz swój serwer..."></textarea>
        </div>
        <div class="modal-section">
            <label class="modal-label">TAGI (ODDZIEL PRZECINKIEM):</label>
            <input type="text" class="modal-input" placeholder="np. gry, społeczność, programowanie">
        </div>
        <div class="setting-item" style="margin-top: 8px;">
            <div>
                <div style="font-weight: 700;">Widoczność na liście</div>
                <div style="font-size: 0.8rem; color: var(--text-gray);">Czy serwer ma być widoczny w publicznym rankingu.</div>
            </div>
            <label class="switch">
                <input type="checkbox" checked>
                <span class="slider round"></span>
            </label>
        </div>
    </div>
</div>
